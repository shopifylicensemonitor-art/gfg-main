[build]
  publish = "gfg-main/dist"
  command = "cd gfg-main && npm install && npm run build"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "PORT,ACCESS_PIN,TRACKING_BASE_URL,FRONTEND_ORIGIN,GOOGLE_REDIRECT_URI,GOOGLE_LOGIN_REDIRECT_URI"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
