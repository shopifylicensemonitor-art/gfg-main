<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="peakGrad" x1="30" y1="160" x2="170" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="120" y1="100" x2="175" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Mountain / Peak triangle -->
  <polygon points="100,28 28,168 172,168" stroke="url(#peakGrad)" stroke-width="8" fill="none" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- X cross inside the mountain -->
  <line x1="62" y1="72" x2="138" y2="148" stroke="url(#peakGrad)" stroke-width="9" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="138" y1="72" x2="62" y2="148" stroke="url(#peakGrad)" stroke-width="9" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Upward arrow on the right peak -->
  <line x1="148" y1="100" x2="170" y2="38" stroke="url(#arrowGrad)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <polyline points="156,42 170,38 174,54" stroke="url(#arrowGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
</svg>
