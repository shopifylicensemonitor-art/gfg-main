name: Supabase & Netlify Keep-Alive

on:
  schedule:
    # Runs every 3 days at 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Enables manual trigger from GitHub Actions UI

jobs:
  keep-alive:
    name: Ping Database Keep-Alive Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Send API Health Check Query to Supabase
        run: |
          echo "Pinging Peak Xender health check to maintain Supabase database activity..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://send.peakconix.site/api/health)
          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 401 ]; then
            echo "Keep-alive ping successful. Supabase database activity registered."
          else
            echo "Warning: Received HTTP $HTTP_STATUS from health check."
          fi
